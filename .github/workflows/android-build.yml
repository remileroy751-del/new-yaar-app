name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installe Gradle 8.7 (version compatible avec AGP 8.5.2, voir app/build.gradle.kts)
      # de façon fiable, indépendamment de la version de Gradle préinstallée sur la
      # machine GitHub Actions — c'est cette dépendance implicite (via "gradle wrapper
      # --gradle-version 8.7", qui s'exécutait avec le Gradle système, devenu 9.7.0
      # sans prévenir) qui causait l'échec précédent ("addKspConfigurations").
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore google-services.json (Firebase, si configuré)
        # Une fois Firebase configuré (voir BACKEND_FIREBASE.md), collez le contenu
        # de votre app/google-services.json dans un secret de dépôt nommé
        # GOOGLE_SERVICES_JSON (Settings → Secrets and variables → Actions → New
        # repository secret). Sans ce secret, l'APK compile quand même (les
        # dépendances Firebase sont toujours incluses), mais la synchronisation en
        # ligne ne fonctionnera pas au lancement de l'app — juste le mode 100% local.
        #
        # NOTE : le contexte "secrets" ne peut PAS être utilisé dans une condition
        # "if:" d'étape (restriction de GitHub Actions, pas une erreur de syntaxe) —
        # la vérification "secret vide ou non" se fait donc DANS le script shell
        # ci-dessous plutôt que dans une condition "if:".
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json restauré depuis le secret GOOGLE_SERVICES_JSON."
          else
            echo "Secret GOOGLE_SERVICES_JSON non configuré : compilation sans Firebase actif (mode local)."
          fi

      # "gradle" ici résout vers la version 8.7 installée par setup-gradle ci-dessus
      # (pas de wrapper committé dans ce dépôt — voir note dans README.md).
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaar-app-debug
          path: app/build/outputs/apk/debug/*.apk
