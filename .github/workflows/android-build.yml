name: Yaar-App Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yaar-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Yaar-App
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub-hosted runners already provide a current Android SDK.
      # We deliberately do NOT use android-actions/setup-android@v3 here:
      # that action currently attempts to install the obsolete SDK package
      # "tools", which causes sdkmanager to exit with code 1.
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/emulator" >> "$GITHUB_PATH"
          sdkmanager --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          yes | sdkmanager --licenses >/dev/null

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests and compile debug APK
        shell: bash
        run: |
          set -e
          gradle testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yaar-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
