name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Si un secret est configuré, il est prioritaire. Sinon, le fichier peut
          # être versionné dans app/google-services.json (Firebase client config).
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json restauré depuis le secret GitHub."
          fi

          if [ ! -s app/google-services.json ]; then
            echo "ERREUR: app/google-services.json est absent."
            echo "Ajoutez ce fichier au dépôt OU créez le secret GitHub Actions GOOGLE_SERVICES_JSON."
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("app/google-services.json")
          data = json.loads(p.read_text())
          clients = data.get("client", [])
          package_names = [
              c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for c in clients
          ]
          if "com.yaarapp.app" not in package_names:
              raise SystemExit(
                  "ERREUR: google-services.json ne contient pas la configuration Android "
                  "pour com.yaarapp.app."
              )
          print("Configuration Firebase valide pour com.yaarapp.app.")
          PY

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yaar-app-debug
          path: app/build/outputs/apk/debug/*.apk

