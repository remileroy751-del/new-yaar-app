name: Yaar-App Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yaar-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Yaar-App
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK (stable)
        uses: android-actions/setup-android@v3

      # Accept Android SDK licenses before installing any platform package.
      # This avoids sdkmanager exit code 1 caused by the Android SDK Preview
      # license prompt on GitHub-hosted runners.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK 35 (stable)
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests and compile debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yaar-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
